<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨设备P2P文件传输工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        success: '#00B42A',
                        warning: '#FF7D00',
                        danger: '#F53F3F',
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .drop-area-active { @apply border-primary bg-blue-50; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-gray-800 mb-2">跨设备P2P文件传输</h1>
            <p class="text-gray-500 max-w-xl mx-auto">两台设备通过浏览器直连互传文件，文件不经过第三方服务器，安全快速</p>
        </header>

        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-gray-800">连接状态</h2>
                <div id="statusBadge" class="px-3 py-1 rounded-full text-sm bg-gray-200 text-gray-600">
                    <i class="fa fa-circle-o mr-1"></i>未连接
                </div>
            </div>

            <div id="connInfo" class="text-sm text-gray-500 mb-3 hidden"></div>

            <div class="grid md:grid-cols-2 gap-4">
                <div class="border border-gray-200 rounded-lg p-4">
                    <h3 class="font-medium text-gray-700 mb-3">创建房间（作为接收方）</h3>
                    <button id="createRoomBtn" class="w-full bg-primary hover:bg-primary/90 text-white py-2 rounded-lg transition-all">
                        <i class="fa fa-plus mr-2"></i>生成房间号
                    </button>
                    <div id="roomIdContainer" class="mt-3 hidden">
                        <p class="text-sm text-gray-500 mb-1">你的房间号（发给对方）：</p>
                        <div class="flex">
                            <input type="text" id="roomIdInput" readonly class="flex-1 border border-gray-300 rounded-l-lg px-3 py-2 bg-gray-50 font-mono">
                            <button id="copyRoomBtn" class="bg-gray-200 hover:bg-gray-300 px-3 rounded-r-lg transition-all">
                                <i class="fa fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="border border-gray-200 rounded-lg p-4">
                    <h3 class="font-medium text-gray-700 mb-3">加入房间（作为发送方）</h3>
                    <div class="flex">
                        <input type="text" id="joinRoomInput" placeholder="输入对方房间号" class="flex-1 border border-gray-300 rounded-l-lg px-3 py-2 font-mono">
                        <button id="joinRoomBtn" class="bg-success hover:bg-success/90 text-white px-4 rounded-r-lg transition-all">
                            连接
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">文件传输</h2>
            <div id="dropArea" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer transition-all hover:border-primary mb-4">
                <i class="fa fa-cloud-upload text-4xl text-gray-400 mb-3"></i>
                <p class="text-gray-600 mb-1">拖拽文件到此处，或点击选择文件</p>
                <p class="text-sm text-gray-400">连接成功后即可发送文件给对方</p>
                <input type="file" id="fileInput" multiple class="hidden">
            </div>

            <div id="transferList" class="space-y-3">
                <div id="emptyTransfer" class="text-center py-6 text-gray-400">
                    <i class="fa fa-exchange text-3xl mb-2"></i>
                    <p>暂无传输任务</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">接收的文件</h2>
            <div id="receivedList" class="space-y-3">
                <div id="emptyReceived" class="text-center py-6 text-gray-400">
                    <i class="fa fa-download text-3xl mb-2"></i>
                    <p>暂无接收的文件</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ 可调参数 ============
        const CHUNK_SIZE = 256 * 1024;          // 256KB 每块
        const PARALLEL_CONNS = 4;               // 并行连接数
        const BUFFER_HIGH = 2 * 1024 * 1024;    // 单连接缓冲高水位 2MB
        const BUFFER_LOW  = 512 * 1024;         // 降到低水位再继续
        const CONNECT_TIMEOUT = 15000;          // 建连超时 15 秒

        // 方案三：只靠 STUN，不配 TURN。多放几个公共 STUN 提高打洞成功率
        const ICE_SERVERS = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' },
            { urls: 'stun:stun.twilio.com:3478' },
        ];

        // ============ 全局状态 ============
        let peer = null;
        let conns = [];
        let currentRoomId = null;
        let isHost = false;
        let connectedCount = 0;
        let connectTimer = null;

        // ============ DOM ============
        const statusBadge = document.getElementById('statusBadge');
        const connInfo = document.getElementById('connInfo');
        const createRoomBtn = document.getElementById('createRoomBtn');
        const roomIdContainer = document.getElementById('roomIdContainer');
        const roomIdInput = document.getElementById('roomIdInput');
        const copyRoomBtn = document.getElementById('copyRoomBtn');
        const joinRoomInput = document.getElementById('joinRoomInput');
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const transferList = document.getElementById('transferList');
        const emptyTransfer = document.getElementById('emptyTransfer');
        const receivedList = document.getElementById('receivedList');
        const emptyReceived = document.getElementById('emptyReceived');

        function updateStatus(connected) {
            if (connected) {
                statusBadge.innerHTML = '<i class="fa fa-check-circle mr-1"></i>已连接';
                statusBadge.className = 'px-3 py-1 rounded-full text-sm bg-green-100 text-green-700';
            } else {
                statusBadge.innerHTML = '<i class="fa fa-circle-o mr-1"></i>未连接';
                statusBadge.className = 'px-3 py-1 rounded-full text-sm bg-gray-200 text-gray-600';
            }
        }

        function showConnInfo(text, isWarn) {
            connInfo.classList.remove('hidden');
            connInfo.textContent = text;
            connInfo.className = 'text-sm mb-3 ' + (isWarn ? 'text-warning' : 'text-gray-500');
        }

        function generateRoomId() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        function clearConnectTimer() {
            if (connectTimer) { clearTimeout(connectTimer); connectTimer = null; }
        }

        // ============ 创建房间（接收方） ============
        createRoomBtn.addEventListener('click', () => {
            const roomId = generateRoomId();
            isHost = true;
            currentRoomId = roomId;
            connectedCount = 0;
            conns = [];

            peer = new Peer(roomId, { debug: 1, config: { iceServers: ICE_SERVERS } });

            peer.on('open', (id) => {
                roomIdInput.value = id;
                roomIdContainer.classList.remove('hidden');
                createRoomBtn.disabled = true;
                createRoomBtn.classList.add('opacity-50', 'cursor-not-allowed');
                showConnInfo('等待对方加入…');
            });

            peer.on('connection', (connection) => {
                conns.push(connection);
                setupReceiveConnection(connection);
            });

            peer.on('error', (err) => {
                alert('创建房间失败：' + err.type);
                resetConnection();
            });
        });

        // ============ 加入房间（发送方，建多条连接） ============
        joinRoomBtn.addEventListener('click', () => {
            const roomId = joinRoomInput.value.trim().toUpperCase();
            if (!roomId) { alert('请输入房间号'); return; }

            isHost = false;
            currentRoomId = roomId;
            connectedCount = 0;
            conns = [];

            peer = new Peer({ debug: 1, config: { iceServers: ICE_SERVERS } });

            peer.on('open', () => {
                showConnInfo('正在打洞建立直连…');
                for (let i = 0; i < PARALLEL_CONNS; i++) {
                    const conn = peer.connect(roomId, { reliable: true, serialization: 'binary' });
                    conns.push(conn);
                    setupSendConnection(conn, i);
                }
                connectTimer = setTimeout(() => {
                    const openCount = conns.filter(c => c.open).length;
                    if (openCount === 0) {
                        showConnInfo('本次直连失败：15 秒内没有通道建立。跨国直连依赖双方 NAT 类型，建议换网络（如手机热点）或重试。', true);
                    } else {
                        showConnInfo(`仅 ${openCount}/${PARALLEL_CONNS} 条通道建立，直连质量可能较差。`, true);
                    }
                }, CONNECT_TIMEOUT);
            });

            peer.on('error', (err) => {
                alert('连接失败：' + err.type + '，请检查房间号是否正确');
                resetConnection();
            });
        });

        // ============ 发送方连接初始化 ============
        function setupSendConnection(conn, idx) {
            conn.on('open', () => {
                connectedCount++;
                clearConnectTimer();
                const openCount = conns.filter(c => c.open).length;
                showConnInfo(`已建立 ${openCount}/${PARALLEL_CONNS} 条直连通道`);
                if (connectedCount >= 1) updateStatus(true);
                // 建连后测一次 RTT，粗略反映链路质量
                probeRTT(conn, idx);
            });
            conn.on('close', () => {
                connectedCount = Math.max(0, connectedCount - 1);
                if (connectedCount === 0) { updateStatus(false); resetConnection(); }
                else showConnInfo(`部分通道断开，剩余 ${conns.filter(c => c.open).length} 条`, true);
            });
            conn.on('error', (e) => console.warn('conn error', idx, e));
            conn.on('data', (data) => {
                // 接收方回传的 pong
                if (data && data.type === 'pong') {
                    const rtt = Date.now() - data.t;
                    const openCount = conns.filter(c => c.open).length;
                    showConnInfo(`已建立 ${openCount}/${PARALLEL_CONNS} 条直连通道 · 通道${idx} RTT ${rtt}ms`);
                }
            });
        }

        function probeRTT(conn, idx) {
            if (!conn.open) return;
            try {
                conn.send({ type: 'ping', t: Date.now(), idx });
            } catch (e) { /* ignore */ }
        }

        // ============ 接收方连接初始化 ============
        function setupReceiveConnection(conn) {
            conn.on('open', () => {
                updateStatus(true);
                showConnInfo('对方已连接，等待传输');
            });
            conn.on('data', (data) => {
                if (data && data.type === 'ping') {
                    try { conn.send({ type: 'pong', t: data.t, idx: data.idx }); } catch (e) {}
                    return;
                }
                handleReceivedData(data, conn);
            });
            conn.on('close', () => {
                if (conns.every(c => !c.open)) updateStatus(false);
            });
        }

        function resetConnection() {
            clearConnectTimer();
            if (peer) peer.destroy();
            peer = null;
            conns = [];
            currentRoomId = null;
            isHost = false;
            connectedCount = 0;
            updateStatus(false);
            connInfo.classList.add('hidden');
            createRoomBtn.disabled = false;
            createRoomBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            roomIdContainer.classList.add('hidden');
            roomIdInput.value = '';
            joinRoomInput.value = '';
        }

        copyRoomBtn.addEventListener('click', () => {
            roomIdInput.select();
            document.execCommand('copy');
            alert('房间号已复制到剪贴板');
        });

        // ============ 文件选择 / 拖拽 ============
        dropArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            sendFiles(e.target.files);
            fileInput.value = '';
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, (e) => {
                e.preventDefault(); e.stopPropagation();
                dropArea.classList.add('drop-area-active');
            });
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, (e) => {
                e.preventDefault(); e.stopPropagation();
                dropArea.classList.remove('drop-area-active');
            });
        });
        dropArea.addEventListener('drop', (e) => sendFiles(e.dataTransfer.files));

        // ============ 背压发送 ============
        function makeConnectionSender(conn) {
            const queue = [];
            let sending = false;
            return {
                enqueue(task) {
                    queue.push(task);
                    if (sending) return;
                    sending = true;
                    (function step() {
                        if (queue.length === 0) { sending = false; return; }
                        const dc = conn.dataChannel;
                        if (!dc) { setTimeout(step, 10); return; }
                        if (dc.bufferedAmount > BUFFER_HIGH) { setTimeout(step, 10); return; }
                        const t = queue.shift();
                        t();
                        if (dc.bufferedAmount > BUFFER_LOW) setTimeout(step, 5);
                        else step();
                    })();
                }
            };
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        // ============ 发送文件（多连接并行 + 存活通道动态分配） ============
        function sendFiles(files) {
            const openConns = conns.filter(c => c.open);
            if (openConns.length === 0) {
                alert('请先连接到对方设备');
                return;
            }

            Array.from(files).forEach(file => {
                const transferId = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

                const item = document.createElement('div');
                item.className = 'border border-gray-200 rounded-lg p-3';
                item.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <p class="text-gray-800 font-medium truncate">${file.name} <span class="text-xs text-gray-400">(${formatSize(file.size)})</span></p>
                        <span class="text-sm text-gray-500 status">准备发送...</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="bg-primary h-2 rounded-full bar" style="width: 0%"></div>
                    </div>
                    <div class="text-xs text-gray-400 mt-1 speed"></div>
                `;
                transferList.insertBefore(item, emptyTransfer);
                emptyTransfer.classList.add('hidden');

                const statusEl = item.querySelector('.status');
                const barEl = item.querySelector('.bar');
                const speedEl = item.querySelector('.speed');

                // 先发 meta
                openConns[0].send({
                    type: 'file-meta', transferId, name: file.name,
                    size: file.size, totalChunks, chunkSize: CHUNK_SIZE
                });

                let sentChunks = 0;
                let sentBytes = 0;
                let startTime = Date.now();
                let lastTime = startTime, lastBytes = 0;

                // 为每条连接建 sender（按当前 open 的连接）
                const senderMap = new Map();
                openConns.forEach(c => senderMap.set(c, makeConnectionSender(c)));

                let nextIndex = 0;

                function pickAliveConn() {
                    // 优先选当前仍 open 的连接
                    const alive = openConns.filter(c => c.open);
                    if (alive.length === 0) return null;
                    return alive[nextIndex % alive.length];
                }

                function dispatchNext() {
                    if (sentChunks >= totalChunks) return;

                    // 若所有通道都断了，终止
                    if (openConns.every(c => !c.open)) {
                        statusEl.textContent = '发送中断：连接已断开';
                        return;
                    }

                    const index = nextIndex++;
                    // 找一个存活通道
                    const alive = openConns.filter(c => c.open);
                    const conn = alive[index % alive.length];
                    const sender = senderMap.get(conn);
                    const offset = index * CHUNK_SIZE;
                    const chunk = file.slice(offset, offset + CHUNK_SIZE);

                    sender.enqueue(() => {
                        if (!conn.open) {
                            // 该通道已断，把这块重新排到队列（简单重试一次）
                            nextIndex = Math.min(nextIndex, index);
                            setTimeout(dispatchNext, 20);
                            return;
                        }
                        chunk.arrayBuffer().then(buffer => {
                            try {
                                conn.send({ type: 'file-chunk', transferId, index, chunk: buffer });
                            } catch (e) {
                                // 发送失败，简单重试
                                setTimeout(dispatchNext, 50);
                                return;
                            }
                            sentChunks++;
                            sentBytes += buffer.byteLength;
                            const now = Date.now();
                            if (now - lastTime >= 500) {
                                const instSpeed = (sentBytes - lastBytes) / ((now - lastTime) / 1000);
                                const avgSpeed = sentBytes / ((now - startTime) / 1000);
                                speedEl.textContent = `速度 ${(instSpeed/1024/1024).toFixed(2)} MB/s（平均 ${(avgSpeed/1024/1024).toFixed(2)} MB/s） · ${formatSize(sentBytes)} / ${formatSize(file.size)}`;
                                lastTime = now; lastBytes = sentBytes;
                            }
                            const progress = (sentChunks / totalChunks) * 100;
                            barEl.style.width = progress + '%';
                            statusEl.textContent = `发送中 ${Math.round(progress)}%`;
                            if (sentChunks === totalChunks) {
                                statusEl.textContent = '发送完成';
                                barEl.style.width = '100%';
                                const totalSec = (Date.now() - startTime) / 1000;
                                speedEl.textContent = `完成，用时 ${totalSec.toFixed(1)}s，平均 ${(file.size/1024/1024/totalSec).toFixed(2)} MB/s`;
                            }
                        });
                    });

                    if (nextIndex < totalChunks) setTimeout(dispatchNext, 0);
                }
                dispatchNext();
            });
        }

        // ============ 接收端 ============
        const receivedFiles = {};

        function handleReceivedData(data) {
            if (data.type === 'file-meta') {
                const { transferId, name, size, totalChunks } = data;
                if (receivedFiles[transferId]) return;
                receivedFiles[transferId] = {
                    name, size, totalChunks,
                    chunks: new Array(totalChunks),
                    received: 0, done: false,
                    startTime: Date.now(), lastTime: Date.now(), lastBytes: 0, receivedBytes: 0
                };

                const el = document.createElement('div');
                el.className = 'border border-gray-200 rounded-lg p-3';
                el.id = 'receive_' + transferId;
                el.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <p class="text-gray-800 font-medium truncate">${name} <span class="text-xs text-gray-400">(${formatSize(size)})</span></p>
                        <span class="text-sm text-gray-500 status">接收中 0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="bg-success h-2 rounded-full bar" style="width: 0%"></div>
                    </div>
                    <div class="text-xs text-gray-400 mt-1 speed"></div>
                `;
                receivedList.insertBefore(el, emptyReceived);
                emptyReceived.classList.add('hidden');
            } else if (data.type === 'file-chunk') {
                const f = receivedFiles[data.transferId];
                if (!f || f.done) return;
                if (f.chunks[data.index]) return;
                f.chunks[data.index] = data.chunk;
                f.received++;
                f.receivedBytes += data.chunk.byteLength || 0;

                const el = document.getElementById('receive_' + data.transferId);
                if (!el) return;
                const progress = (f.received / f.totalChunks) * 100;
                el.querySelector('.bar').style.width = progress + '%';
                el.querySelector('.status').textContent = `接收中 ${Math.round(progress)}%`;

                const now = Date.now();
                if (now - f.lastTime >= 500) {
                    const instSpeed = (f.receivedBytes - f.lastBytes) / ((now - f.lastTime) / 1000);
                    const avgSpeed = f.receivedBytes / ((now - f.startTime) / 1000);
                    el.querySelector('.speed').textContent = `速度 ${(instSpeed/1024/1024).toFixed(2)} MB/s（平均 ${(avgSpeed/1024/1024).toFixed(2)} MB/s） · ${formatSize(f.receivedBytes)} / ${formatSize(f.size)}`;
                    f.lastTime = now; f.lastBytes = f.receivedBytes;
                }

                if (f.received === f.totalChunks) {
                    f.done = true;
                    const blob = new Blob(f.chunks);
                    const url = URL.createObjectURL(blob);
                    el.querySelector('.status').textContent = '接收完成';
                    const totalSec = (Date.now() - f.startTime) / 1000;
                    el.querySelector('.speed').textContent = `完成，用时 ${totalSec.toFixed(1)}s，平均 ${(f.size/1024/1024/totalSec).toFixed(2)} MB/s`;
                    const a = document.createElement('a');
                    a.href = url; a.download = f.name;
                    a.className = 'mt-2 inline-block bg-success hover:bg-success/90 text-white px-4 py-1 rounded-lg text-sm transition-all';
                    a.innerHTML = '<i class="fa fa-download mr-1"></i>下载文件';
                    el.appendChild(a);
                    delete receivedFiles[data.transferId];
                }
            }
        }

        updateStatus(false);
    </script>
</body>
</html>
